<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Plano eléctrico por bloques de un robot móvil</title>
  <desc id="description">La batería alimenta el regulador, el ESP32 y el driver. El sensor entrega mediciones al ESP32; el ESP32 controla el LED y el driver, y el driver alimenta el motor.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061925"/>
      <stop offset="1" stop-color="#04111A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12364A"/>
      <stop offset="1" stop-color="#0B2738"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <marker id="arrowPower" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#39C8F0"/>
    </marker>
    <marker id="arrowSignal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#A98BFF"/>
    </marker>
    <style>
      .eyebrow{font:700 20px Arial,sans-serif;fill:#69DCF8;letter-spacing:2px}
      .heading{font:700 38px Arial,sans-serif;fill:#F5FAFD}
      .caption{font:400 20px Arial,sans-serif;fill:#9CB6C8}
      .name{font:700 24px Arial,sans-serif;fill:#F5FAFD}
      .detail{font:400 17px Arial,sans-serif;fill:#9CB6C8}
      .pin{font:700 15px Arial,sans-serif;fill:#69DCF8;letter-spacing:.5px}
      .rail{font:700 16px Arial,sans-serif;fill:#C8EAF4}
      .power{stroke:#39C8F0;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .signal{stroke:#A98BFF;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .ground{stroke:#68889B;stroke-width:5;fill:none;stroke-linecap:round}
      .node{fill:#39C8F0}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1440" cy="80" r="280" fill="#0A84C7" opacity=".08"/>
  <circle cx="160" cy="830" r="250" fill="#39C8F0" opacity=".04"/>

  <text x="82" y="70" class="eyebrow">E1A · PLANO ELÉCTRICO DEL ROBOT</text>
  <text x="82" y="120" class="heading">Alimentación, control y actuación</text>
  <text x="82" y="156" class="caption">Sigue las líneas por color y reconoce qué información circula entre los bloques.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="315" width="205" height="150" rx="24" fill="url(#card)" stroke="#0A84C7" stroke-width="4"/>
    <rect x="350" y="315" width="220" height="150" rx="24" fill="url(#card)" stroke="#39C8F0" stroke-width="4"/>
    <rect x="670" y="275" width="260" height="230" rx="26" fill="url(#card)" stroke="#F5FAFD" stroke-width="4"/>
    <rect x="1060" y="555" width="230" height="145" rx="24" fill="url(#card)" stroke="#39C8F0" stroke-width="4"/>
    <circle cx="1450" cy="628" r="75" fill="#0B2738" stroke="#F5FAFD" stroke-width="5"/>
    <rect x="1060" y="220" width="230" height="135" rx="24" fill="url(#card)" stroke="#39C8F0" stroke-width="4"/>
    <rect x="1060" y="390" width="230" height="125" rx="24" fill="url(#card)" stroke="#39C8F0" stroke-width="4"/>
  </g>

  <path d="M277 390H350" class="power" marker-end="url(#arrowPower)"/>
  <path d="M570 390H670" class="power" marker-end="url(#arrowPower)"/>
  <path d="M175 465V790H1450V703" class="ground"/>
  <path d="M460 465V790" class="ground"/>
  <path d="M800 505V790" class="ground"/>
  <path d="M1180 700V790" class="ground"/>
  <circle cx="175" cy="790" r="7" class="node"/>
  <circle cx="460" cy="790" r="7" class="node"/>
  <circle cx="800" cy="790" r="7" class="node"/>
  <circle cx="1180" cy="790" r="7" class="node"/>
  <circle cx="1450" cy="790" r="7" class="node"/>

  <path d="M930 320H1060" class="signal" marker-end="url(#arrowSignal)"/>
  <path d="M1060 342H965V360H930" class="signal" marker-end="url(#arrowSignal)"/>
  <path d="M930 450H1060" class="signal" marker-end="url(#arrowSignal)"/>
  <path d="M850 505V628H1060" class="signal" marker-end="url(#arrowSignal)"/>
  <path d="M1290 628H1370" class="power" marker-end="url(#arrowPower)"/>

  <path d="M570 390H620V205H1180V220" class="power" marker-end="url(#arrowPower)"/>
  <path d="M620 390V630H1060" class="power" marker-end="url(#arrowPower)"/>
  <circle cx="620" cy="390" r="8" class="node"/>

  <text x="174" y="357" text-anchor="middle" class="pin">FUENTE</text>
  <text x="174" y="402" text-anchor="middle" class="name">Batería</text>
  <text x="174" y="434" text-anchor="middle" class="detail">12 V</text>

  <text x="460" y="357" text-anchor="middle" class="pin">CONVERSIÓN</text>
  <text x="460" y="402" text-anchor="middle" class="name">Regulador buck</text>
  <text x="460" y="434" text-anchor="middle" class="detail">12 V → 5 V</text>

  <text x="800" y="325" text-anchor="middle" class="pin">CONTROL</text>
  <text x="800" y="380" text-anchor="middle" class="name">ESP32</text>
  <text x="800" y="418" text-anchor="middle" class="detail">Lógica de 3,3 V</text>
  <text x="800" y="458" text-anchor="middle" class="detail">Entradas · decisión · salidas</text>

  <text x="1175" y="260" text-anchor="middle" class="pin">ENTRADA</text>
  <text x="1175" y="302" text-anchor="middle" class="name">Sensor ultrasónico</text>
  <text x="1175" y="330" text-anchor="middle" class="detail">TRIG / ECHO</text>

  <text x="1175" y="426" text-anchor="middle" class="pin">INDICACIÓN</text>
  <text x="1175" y="470" text-anchor="middle" class="name">LED + 330 Ω</text>
  <text x="1175" y="495" text-anchor="middle" class="detail">Estado del robot</text>

  <text x="1175" y="595" text-anchor="middle" class="pin">POTENCIA</text>
  <text x="1175" y="638" text-anchor="middle" class="name">Driver TB6612</text>
  <text x="1175" y="670" text-anchor="middle" class="detail">PWM / sentido</text>

  <text x="1450" y="620" text-anchor="middle" class="name">M</text>
  <text x="1450" y="650" text-anchor="middle" class="detail">Motor DC</text>

  <text x="305" y="372" text-anchor="middle" class="rail">12 V</text>
  <text x="617" y="370" text-anchor="end" class="rail">5 V</text>
  <text x="988" y="306" text-anchor="middle" class="rail">TRIG</text>
  <text x="988" y="378" text-anchor="middle" class="rail">ECHO</text>
  <text x="993" y="438" text-anchor="middle" class="rail">GPIO</text>
  <text x="960" y="614" text-anchor="middle" class="rail">PWM</text>
  <text x="1330" y="612" text-anchor="middle" class="rail">VM</text>

  <circle cx="82" cy="842" r="7" fill="#39C8F0"/>
  <text x="108" y="848" class="rail">Alimentación</text>
  <circle cx="315" cy="842" r="7" fill="#A98BFF"/>
  <text x="341" y="848" class="rail">Señal de control</text>
  <circle cx="535" cy="842" r="7" fill="#68889B"/>
  <text x="561" y="848" class="rail">Retorno común GND</text>
</svg>
